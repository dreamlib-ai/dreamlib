# Eval hedefleri: her parametre bir blok. Açıklama ve kaynaklar: docs/eval-hedefleri.md.
# L6 eval iskeleti bu dosyayı okur; sonuç tablosu her satırı hedefle karşılaştırır.
#
# metric: f1 | macro_f1 | precision | recall | accuracy | exact_agreement | mape | rate
# target: tutturulacak en düşük değer (mape için en yüksek)
# human:  insan kodlayıcılar arası uyum (varsa); model hedefi bunun altında kalır, üstü beklenmez
# reference: yayımlanmış model sonucu (varsa)
# rule: "human_ratio" ise hedef = human × 0,90; "fixed" ise target olduğu gibi
# set: hangi eval setinde ölçülür

# --- Duygu (HVdC beş sınıf; Domhoff 1996, Bertolini ve ark. 2024) ---
[emotion_presence_macro_f1]
metric = "macro_f1"
target = 0.80
reference = 0.85
set = "extract"
note = "Rapor başına beş duygunun var/yok çıktısı"

[emotion_sadness_f1]
metric = "f1"
target = 0.70
reference = 0.77
set = "extract"

[emotion_positive_f1]
metric = "f1"
target = 0.80
reference = 0.52
set = "extract"
note = "Mutluluk; hazır duygu modellerinin en zayıf yeri"

[emotion_exact_agreement]
metric = "exact_agreement"
human = 0.63
rule = "human_ratio"
set = "extract"
note = "Kim, hangi duygu: HVdC tam uyumu"

[emotion_tr_gap]
metric = "rate"
target = 0.05
set = "extract"
note = "Türkçe makro F1, İngilizceden en çok bu kadar düşük (en yüksek)"

