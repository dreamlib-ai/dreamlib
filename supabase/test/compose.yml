# Gerçek veritabanı testleri için yerel yığın: canlıdaki Supabase Postgres imajı (auth ve storage
# şemaları, pgvector içinde) ve uygulamanın konuştuğu REST katmanı PostgREST. Yalnız test içindir;
# parolalar ve JWT sırrı sabit test değerleridir. Çalıştırma: scripts/db-test.ps1 (npm run test:db).
name: dreamlib-dbtest

services:
  db:
    image: supabase/postgres:17.11.0.019
    environment:
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: dreamlib-local-test-secret-not-for-production-use
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 60

  rest:
    image: postgrest/postgrest:v13.0.7
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: dreamlib-local-test-secret-not-for-production-use
      PGRST_DB_POOL: "5"
    ports:
      - "127.0.0.1:55433:3000"
    profiles: ["rest"]
