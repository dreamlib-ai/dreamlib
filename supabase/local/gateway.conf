# dreamlib-local ağ geçidi: uygulama Supabase'e hangi yollarla konuşuyorsa yerelde de aynısı.
# nginx şablonu: ${DREAMLIB_API_PORT} açılışta doldurulur. Canlıdaki Kong'un apikey denetimi yok;
# yalnız yerel kullanım içindir.
server {
  listen ${DREAMLIB_API_PORT};
  client_max_body_size 50m;

  # CORS is answered here, as Kong does on Supabase: GoTrue's own check refuses supabase-js headers
  # (x-client-info, x-supabase-api-version). The services' headers are dropped so none come twice.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Headers "*" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "Content-Range, X-Total-Count, X-Supabase-Api-Version" always;
  add_header Access-Control-Max-Age "3600" always;
  if ($request_method = OPTIONS) { return 204; }

  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /rest/v1/ { proxy_pass http://rest:3000/; }
  location /auth/v1/ { proxy_pass http://auth:9999/; }
  location /storage/v1/ { proxy_pass http://storage:5000/; }
  location = / { default_type text/plain; return 200 "dreamlib-local\n"; }
}
