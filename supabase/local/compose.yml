# Yerel Supabase: canlıdaki Postgres imajı (auth, pgvector içinde), PostgREST, GoTrue (giriş), storage-api
# (görseller) ve hepsini Supabase'in yollarıyla (/rest/v1, /auth/v1, /storage/v1) tek adreste sunan geçit.
# Uygulama (api, web) ayrı grupta: kökteki compose.yml. Aynı dosya iki proje adıyla çalışır:
#   dreamlib-supabase    kalıcı geliştirme yığını, veritabanı adı dreamlib-local (scripts/local_db.py, npm start)
#   dreamlib-local-test  her test koşusunda sıfırdan kurulup silinen kopya (scripts/db_test.py), yalnız db ve rest
# Volume ve ağ adları veritabanı adından gelir; proje adı değişse de veri kalır.
# Parolalar, JWT sırrı ve anahtarlar yalnız yerel kullanım içindir.

services:
  db:
    image: supabase/postgres:17.11.0.019
    environment:
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: dreamlib-local-test-secret-not-for-production-use
    ports:
      - "127.0.0.1:${DREAMLIB_DB_PORT:-55432}:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 3s
      retries: 60

  rest:
    image: postgrest/postgrest:v13.0.7
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/${DREAMLIB_DB_NAME:-dreamlib-local}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: dreamlib-local-test-secret-not-for-production-use
      PGRST_DB_POOL: "5"
    ports:
      - "127.0.0.1:${DREAMLIB_REST_PORT:-55433}:3000"
    profiles: ["rest"]

  auth:
    image: supabase/gotrue:v2.177.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:${DREAMLIB_API_PORT:-55431}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/${DREAMLIB_DB_NAME:-dreamlib-local}
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: http://localhost:5173/**,http://127.0.0.1:5173/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: dreamlib-local-test-secret-not-for-production-use
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      # İsteğe bağlı Google girişi: Google Cloud'da bir OAuth istemcisi, yönlendirme adresi
      # http://127.0.0.1:55431/auth/v1/callback; kimlik ve sır kabuğun ortamından okunur.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${DREAMLIB_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${DREAMLIB_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${DREAMLIB_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://127.0.0.1:${DREAMLIB_API_PORT:-55431}/auth/v1/callback
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    profiles: ["api"]

  storage:
    image: supabase/storage-api:v1.25.7
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${DREAMLIB_ANON_KEY:-}
      SERVICE_KEY: ${DREAMLIB_SERVICE_KEY:-}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: dreamlib-local-test-secret-not-for-production-use
      PGRST_JWT_SECRET: dreamlib-local-test-secret-not-for-production-use
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/${DREAMLIB_DB_NAME:-dreamlib-local}
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - files:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/status"]
      interval: 2s
      timeout: 3s
      retries: 60
    profiles: ["api"]

  gateway:
    # Supabase'in Kong'unun yerel karşılığı. İçeride de aynı portta dinler: api bu ağdan
    # http://gateway:<port> ile, tarayıcı http://127.0.0.1:<port> ile aynı yollara gelir.
    image: nginx:1.27.5-alpine
    depends_on:
      - rest
      - auth
      - storage
    environment:
      DREAMLIB_API_PORT: ${DREAMLIB_API_PORT:-55431}
      NGINX_ENVSUBST_FILTER: DREAMLIB_
    volumes:
      - ./gateway.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${DREAMLIB_API_PORT:-55431}:${DREAMLIB_API_PORT:-55431}"
    profiles: ["api"]

volumes:
  data:
    name: ${DREAMLIB_DB_NAME:-dreamlib-local}_data
  files:
    name: ${DREAMLIB_DB_NAME:-dreamlib-local}_files

networks:
  default:
    name: ${DREAMLIB_DB_NAME:-dreamlib-local}_net
